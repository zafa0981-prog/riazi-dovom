<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>جمع و تفریق — ریاضی دوم دبستان</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --dot-size: clamp(13px, 3.2vw, 20px);
    --dot-gap: clamp(3px, 0.7vw, 5px);
    --ink: #1e293b;
  }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Vazirmatn', 'Vazir', 'Tahoma', 'Segoe UI', sans-serif;
    color: var(--ink); direction: rtl;
  }
  body {
    background: linear-gradient(135deg, #dbeafe, #fce7f3);
    min-height: 100vh; min-height: 100dvh;
    padding: 10px;
    display: flex; justify-content: center; align-items: flex-start;
    overflow-x: hidden;
  }

  /* ---------- BACKGROUND IMAGE ---------- */
  .bg {
    position: fixed; inset: 0;
    background: url('1.jpg') center center / cover no-repeat;
    z-index: -2;
  }
  .bg::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(255,255,255,.5);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }

  /* ---------- LAYOUT ---------- */
  .app {
    width: 100%; max-width: 920px;
    display: flex; flex-direction: column; gap: 10px;
    padding-bottom: 40px;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; flex-wrap: wrap;
    background: rgba(255,255,255,.9);
    border-radius: 18px; padding: 10px 14px;
    box-shadow: 0 6px 18px rgba(30,64,175,.14);
    border: 2px solid rgba(255,255,255,.95);
  }
  h1 {
    font-size: clamp(.9rem, 3.4vw, 1.25rem);
    margin: 0; color: #1e3a8a;
    display: flex; align-items: center; gap: 6px;
  }
  .tabs {
    display: flex; gap: 4px;
    background: #e0e7ff; padding: 4px;
    border-radius: 999px;
    flex-wrap: wrap; justify-content: center;
  }
  .tab {
    border: none; background: transparent;
    padding: 7px 12px; border-radius: 999px;
    font-family: inherit;
    font-size: clamp(.7rem, 2.2vw, .85rem);
    font-weight: 800; color: #4338ca;
    cursor: pointer; transition: .2s;
    user-select: none; white-space: nowrap;
  }
  .tab.active {
    background: #4f46e5; color: #fff;
    box-shadow: 0 4px 10px rgba(79,70,229,.4);
  }
  .score {
    font-size: clamp(.72rem, 2.4vw, .85rem);
    font-weight: 800; color: #b45309;
    background: #fef3c7;
    border: 2px solid #fcd34d;
    padding: 5px 12px; border-radius: 999px;
    white-space: nowrap;
  }
  .board {
    background: rgba(255,255,255,.94);
    border-radius: 22px; padding: clamp(10px, 2.5vw, 18px);
    box-shadow: 0 10px 30px rgba(30,64,175,.16);
    border: 2px solid rgba(255,255,255,.95);
    display: flex; flex-direction: column; gap: 12px;
  }
  .prompt {
    text-align: center;
    font-size: clamp(.82rem, 2.8vw, 1.02rem);
    font-weight: 800; color: #4f46e5;
    background: #eef2ff; border-radius: 14px;
    padding: 9px 12px; line-height: 1.6;
  }
  .prompt.practice {
    background: #fce7f3; color: #be185d;
  }

  /* ---------- EQUATION ---------- */
  .equation {
    direction: ltr;
    display: flex; align-items: center; justify-content: center;
    gap: clamp(6px, 2vw, 16px); flex-wrap: wrap;
    font-variant-numeric: tabular-nums;
  }
  .num-display {
    font-size: clamp(1.7rem, 8vw, 2.7rem);
    font-weight: 900; color: #1e3a8a;
    line-height: 1; min-width: clamp(42px, 10vw, 72px);
    text-align: center;
    background: #dbeafe;
    border: 3px solid #93c5fd;
    border-radius: 14px; padding: 4px 10px;
    box-shadow: 0 4px 0 #93c5fd;
    transition: background .3s, border-color .3s, color .3s;
  }
  .num-display.answer {
    background: #dcfce7; border-color: #86efac;
    box-shadow: 0 4px 0 #86efac; color: #166534;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .num-display.hidden-answer {
    background: #f3e8ff; border-color: #d8b4fe;
    box-shadow: 0 4px 0 #d8b4fe; color: #7e22ce;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .op-sign {
    font-size: clamp(1.6rem, 6.5vw, 2.4rem);
    font-weight: 900; color: #db2777;
  }
  .equals {
    font-size: clamp(1.6rem, 6.5vw, 2.4rem);
    font-weight: 900; color: #059669;
  }

  /* ---------- DOTS VISUAL ---------- */
  .viz-dots {
    display: flex; align-items: flex-start; justify-content: center;
    gap: clamp(8px, 2.5vw, 18px); flex-wrap: wrap;
    padding: clamp(6px, 1.5vw, 12px);
    background: #f8fafc; border-radius: 16px;
    border: 2px dashed #cbd5e1;
    min-height: clamp(60px, 14vw, 90px);
    transition: background .3s, border-color .3s;
  }
  .viz-dots.practice-mode {
    background: #faf5ff;
    border: 2px dashed #c084fc;
  }
  .dot-group {
    display: flex; flex-wrap: wrap;
    gap: var(--dot-gap); justify-content: center;
    max-width: 100%; padding: 4px;
  }
  .dot {
    width: var(--dot-size); height: var(--dot-size);
    border-radius: 50%;
    background: linear-gradient(145deg, #60a5fa, #2563eb);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.15);
    animation: dotPop .3s cubic-bezier(.34,1.56,.64,1) both;
  }
  .dot.yellow {
    background: linear-gradient(145deg, #fbbf24, #d97706);
  }
  .dot.crossed {
    background: #e5e7eb; box-shadow: none; position: relative;
  }
  .dot.crossed::after {
    content: '✕'; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #ef4444; font-weight: 900;
    font-size: calc(var(--dot-size) * 0.75); line-height: 1;
  }
  @keyframes dotPop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .visual-sign {
    font-size: clamp(1.1rem, 3.6vw, 1.5rem);
    font-weight: 900; color: #64748b;
    align-self: center;
  }
  .dots-placeholder {
    display: flex; align-items: center; justify-content: center;
    padding: 10px 24px;
    background: #f3e8ff;
    border: 3px dashed #c084fc;
    border-radius: 16px;
    color: #7e22ce;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: 900;
    min-height: 60px;
  }
  .dots-placeholder small {
    font-size: .55em; font-weight: 700;
    margin-inline-start: 8px; opacity: .7;
  }

  /* ---------- NUMBER LINE ---------- */
  .number-line-wrap {
    padding: clamp(6px, 1.5vw, 12px) clamp(4px, 1vw, 8px);
    background: #f8fafc;
    border-radius: 16px;
    border: 2px dashed #cbd5e1;
    transition: background .3s, border-color .3s;
  }
  .number-line-wrap[hidden] { display: none !important; }
  .number-line-wrap.practice-mode {
    background: #faf5ff;
    border: 2px dashed #c084fc;
  }
  .number-line-wrap svg {
    width: 100%; height: auto; display: block;
  }
  .nl-tick-label { font-family: 'Vazirmatn', Tahoma, sans-serif; }
  .nl-arc-anim { animation: drawArc .8s ease-out both; }
  @keyframes drawArc {
    0% { stroke-dasharray: 1400; stroke-dashoffset: 1400; }
    100% { stroke-dasharray: 1400; stroke-dashoffset: 0; }
  }
  .nl-marker {
    animation: markerPop .45s cubic-bezier(.34,1.56,.64,1) both;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes markerPop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .nl-svg-text {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    font-weight: 900;
    user-select: none;
  }

  /* ---------- LEARN CONTROLS ---------- */
  .learn-controls {
    display: flex; flex-direction: column; gap: 10px;
  }
  .learn-controls[hidden] { display: none !important; }
  .op-switch { display: flex; justify-content: center; gap: 10px; }
  .op-btn {
    border: none; font-family: inherit;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    font-weight: 900;
    width: clamp(56px, 15vw, 74px);
    height: clamp(44px, 11vw, 56px);
    border-radius: 14px; cursor: pointer; color: #fff;
    transition: transform .1s;
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
    user-select: none;
  }
  .op-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .op-btn[data-op="+"] { background: linear-gradient(160deg, #60a5fa, #2563eb); }
  .op-btn[data-op="-"] { background: linear-gradient(160deg, #f472b6, #db2777); }
  .op-btn.active { outline: 4px solid #fbbf24; outline-offset: 2px; }
  .num-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; flex-wrap: wrap;
  }
  .num-row-label {
    font-weight: 800; color: #64748b;
    font-size: clamp(.75rem, 2.6vw, .9rem);
    min-width: 62px;
  }
  .num-ctrl {
    width: clamp(44px, 12vw, 58px);
    height: clamp(40px, 10vw, 52px);
    border-radius: 12px; border: none;
    font-family: inherit;
    font-size: clamp(1.2rem, 5vw, 1.5rem);
    font-weight: 900; color: #fff; cursor: pointer;
    transition: transform .08s;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
    user-select: none;
  }
  .num-ctrl:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
  }
  .num-ctrl.minus { background: linear-gradient(160deg, #f87171, #dc2626); }
  .num-ctrl.plus  { background: linear-gradient(160deg, #4ade80, #16a34a); }
  .num-ctrl:disabled { filter: grayscale(.7) opacity(.4); cursor: not-allowed; }
  .num-val {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 900; color: #1e3a8a;
    min-width: clamp(44px, 12vw, 60px);
    text-align: center;
    background: #e0e7ff; border-radius: 10px;
    padding: 4px 8px;
  }

  /* ---------- PRACTICE OPTIONS ---------- */
  .options {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: clamp(6px, 2vw, 12px); margin-top: 4px;
  }
  .options[hidden] { display: none !important; }
  .option-btn {
    border: none; font-family: inherit;
    font-size: clamp(1.05rem, 4.2vw, 1.45rem);
    font-weight: 900;
    padding: clamp(10px, 3vw, 16px) 6px;
    border-radius: 14px; cursor: pointer; color: #fff;
    transition: transform .1s;
    box-shadow: 0 4px 0 rgba(0,0,0,.2);
    background: linear-gradient(160deg, #a78bfa, #7c3aed);
    user-select: none; font-variant-numeric: tabular-nums;
  }
  .option-btn:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,.2);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct {
    background: linear-gradient(160deg, #4ade80, #16a34a) !important;
    animation: correctPop .5s ease;
  }
  .option-btn.wrong {
    background: linear-gradient(160deg, #f87171, #dc2626) !important;
    animation: shake .45s ease;
  }
  @keyframes correctPop {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* ---------- HINT BUTTON ---------- */
  .hint-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    margin: 0 auto;
    border: none; font-family: inherit;
    font-size: clamp(.78rem, 2.6vw, .9rem);
    font-weight: 800;
    padding: 8px 18px; border-radius: 999px;
    cursor: pointer;
    background: #fef3c7; color: #92400e;
    border: 2px solid #fcd34d;
    transition: transform .1s, background .2s;
    user-select: none;
    box-shadow: 0 3px 0 #fcd34d;
  }
  .hint-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #fcd34d; }
  .hint-btn.active {
    background: #fce7f3; color: #be185d;
    border-color: #f9a8d4;
    box-shadow: 0 3px 0 #f9a8d4;
  }
  .hint-btn[hidden] { display: none !important; }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: rgba(30,41,59,.94); color: #fff;
    padding: 11px 22px; border-radius: 999px;
    font-weight: 800;
    font-size: clamp(.78rem, 2.8vw, .95rem);
    opacity: 0;
    transition: .32s cubic-bezier(.34,1.56,.64,1);
    z-index: 500; pointer-events: none;
    white-space: nowrap; max-width: 92vw;
    overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---------- CONFETTI ---------- */
  .confetti {
    position: fixed; top: -50px; z-index: 999;
    animation: fall 2.1s linear forwards;
    pointer-events: none;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(600deg); opacity: .15; }
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 520px) {
    .nl-tick-label.minor { display: none; }
  }
  @media (max-width: 420px) {
    header { padding: 8px 10px; border-radius: 15px; }
    .board { border-radius: 18px; }
    .options { grid-template-columns: repeat(2, 1fr); }
    .num-row-label { min-width: 48px; }
    .tab { padding: 6px 9px; font-size: .68rem; }
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="app">

  <header>
    <h1>➕ جمع و تفریق ➖</h1>
    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="learn-dots">آموزش با توپ</button>
      <button class="tab" data-mode="practice-dots">تمرین با توپ</button>
      <button class="tab" data-mode="learn-line">آموزش با محور</button>
      <button class="tab" data-mode="practice-line">تمرین با محور</button>
    </div>
    <div class="score" id="score">امتیاز: ۰</div>
  </header>

  <div class="board">
    <div class="prompt" id="prompt">با دکمه‌ها عددها را تغییر بده و جمع و تفریق را ببین!</div>

    <div class="equation" id="equation"></div>

    <div class="viz-dots" id="vizDots"></div>

    <button class="hint-btn" id="hintBtn" hidden>💡 نمایش راهنما</button>

    <div class="number-line-wrap" id="numberLineWrap" hidden>
      <svg id="numberLine" viewBox="0 0 1000 350" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="learn-controls" id="learnControls">
      <div class="op-switch">
        <button class="op-btn active" data-op="+">➕</button>
        <button class="op-btn" data-op="-">➖</button>
      </div>
      <div class="num-row">
        <span class="num-row-label">عدد اول</span>
        <button class="num-ctrl minus" data-ctrl="a-">−</button>
        <span class="num-val" id="valA">۷</span>
        <button class="num-ctrl plus" data-ctrl="a+">+</button>
      </div>
      <div class="num-row">
        <span class="num-row-label">عدد دوم</span>
        <button class="num-ctrl minus" data-ctrl="b-">−</button>
        <span class="num-val" id="valB">۵</span>
        <button class="num-ctrl plus" data-ctrl="b+">+</button>
      </div>
    </div>

    <div class="options" id="options" hidden></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==========================================================
   صدا (Web Audio API)
   ========================================================== */
let actx = null;
function ac() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, delay) {
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(); const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
function sweep(f1, f2, dur, type, vol) {
  const c = ac(); if (!c) return;
  const t0 = c.currentTime;
  const o = c.createOscillator(); const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.06);
}
const SFX = {
  tap()     { tone(800, 0.05, 'square', 0.04); },
  plus()    { tone(523, 0.10, 'sine', 0.10); tone(659, 0.14, 'sine', 0.08, 0.06); },
  minus()   { tone(392, 0.10, 'sine', 0.10); tone(294, 0.14, 'sine', 0.08, 0.06); },
  swap()    { sweep(400, 800, 0.16, 'triangle', 0.08); },
  correct() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.26, 'sine', 0.13, i * 0.09)); },
  wrong()   { tone(220, 0.20, 'sawtooth', 0.08); tone(165, 0.30, 'sawtooth', 0.08, 0.18); },
  start()   { tone(659, 0.12, 'sine', 0.10); tone(880, 0.16, 'sine', 0.09, 0.10); },
  jump()    { sweep(500, 900, 0.4, 'triangle', 0.09); tone(1047, 0.2, 'sine', 0.08, 0.35); }
};

/* ==========================================================
   ابزارها
   ========================================================== */
const FA = '۰۱۲۳۴۵۶۷۸۹';
const toFa = n => String(n).replace(/\d/g, d => FA[+d]);
const $ = id => document.getElementById(id);
const MAX_NUM = 20;

const state = {
  mode: 'learn-dots',
  a: 7,
  b: 5,
  op: '+',
  score: 0,
  locked: false,
  hintShown: false,
  practice: { a: 0, b: 0, op: '+', answer: 0, options: [], revealed: false }
};

/* ==========================================================
   محور اعداد — سه کمان روی یک محور، همه بالای خط
   ==========================================================
   ساختار ارتفاع (viewBox 0 0 1000 350):
     خط اصلی در y = 260
     کمان عدد اول (آبی)   : کنترل 170 → اوج ≈ 211
     کمان عدد دوم (نارنجی): کنترل  90 → اوج ≈ 171
     کمان جواب    (سبز)   : کنترل   0 → اوج ≈ 126
   ========================================================== */
function numberLineSVG(a, b, result, op, revealed) {
  const X0 = 55;
  const XE = 965;
  const DX = (XE - X0) / 20;
  const xOf = n => X0 + n * DX;
  const y = 260;
  const labelY = y + 45;
  const baseY = y - 8;   /* نقطه‌ی شروع/پایان کمان‌ها */

  let s = '';

  /* ---- خط اصلی ---- */
  s += `<line x1="${X0 - 15}" y1="${y}" x2="${XE + 18}" y2="${y}"
              stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/>`;

  /* ---- تیک‌ها و اعداد ۰ تا ۲۰ ---- */
  for (let i = 0; i <= 20; i++) {
    const x = xOf(i);
    const major = i % 5 === 0;
    s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y + (major ? 16 : 8)}"
                stroke="${major ? '#475569' : '#cbd5e1'}"
                stroke-width="${major ? 2.4 : 1.3}" stroke-linecap="round"/>`;
    const cls = major ? 'nl-tick-label major' : 'nl-tick-label minor';
    s += `<text class="${cls}" x="${x}" y="${labelY}" text-anchor="middle"
                font-size="${major ? 17 : 13}" font-weight="${major ? 800 : 600}"
                fill="${major ? '#334155' : '#94a3b8'}">${toFa(i)}</text>`;
  }

  const x0 = xOf(0);
  const xa = xOf(a);
  const xr = xOf(result);

  /* ---- کمان ۱: عدد اول (آبی) — ۰ → a ---- */
  if (a > 0) {
    const mid1 = (x0 + xa) / 2;
    s += `<path class="nl-arc-anim"
                d="M ${x0},${baseY} Q ${mid1},170 ${xa},${baseY}"
                fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>`;
    s += `<text class="nl-svg-text" x="${mid1}" y="200" text-anchor="middle"
                font-size="24" fill="#2563eb">${toFa(a)}</text>`;
  }

  /* ---- کمان ۲: عدد دوم (نارنجی/صورتی) — از انتهای کمان ۱ ---- */
  if (b > 0 && xa !== xr) {
    const mid2 = (xa + xr) / 2;
    const color2 = op === '+' ? '#ea580c' : '#db2777';
    const label2 = op === '+' ? '+' : '−';

    if (revealed) {
      /* کمان کامل و پویا */
      s += `<path class="nl-arc-anim"
                  d="M ${xa},${baseY} Q ${mid2},90 ${xr},${baseY}"
                  fill="none" stroke="${color2}" stroke-width="4.5" stroke-linecap="round"/>`;
      s += `<text class="nl-svg-text" x="${mid2}" y="150" text-anchor="middle"
                  font-size="24" fill="${color2}">${label2}${toFa(b)}</text>`;
    } else {
      /* فلش نقطه‌چین راهنما (در تمرین، قبل از پاسخ) */
      const dir = op === '+' ? 1 : -1;
      const shortEnd = xa + dir * 60;
      const midHint = (xa + shortEnd) / 2;
      s += `<path d="M ${xa},${baseY} Q ${midHint},120 ${shortEnd},${baseY}"
                  fill="none" stroke="${color2}" stroke-width="3.6" stroke-linecap="round"
                  stroke-dasharray="7 6" opacity="0.85"/>`;
      s += `<text class="nl-svg-text" x="${midHint}" y="170" text-anchor="middle"
                  font-size="22" fill="${color2}" opacity="0.9">${label2}${toFa(b)}</text>`;
    }
  }

  /* ---- کمان ۳: جواب (سبز) — ۰ → result، بالای همه ---- */
  if (revealed) {
    if (result > 0 && x0 !== xr) {
      const midR = (x0 + xr) / 2;
      s += `<path class="nl-arc-anim"
                  d="M ${x0},${baseY} Q ${midR},0 ${xr},${baseY}"
                  fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>`;
      s += `<text class="nl-svg-text" x="${midR}" y="118" text-anchor="middle"
                  font-size="24" fill="#16a34a">${toFa(result)}</text>`;
    } else if (result === 0) {
      /* حالت خاص: جواب صفر → کمان کوچک دور ۰ */
      s += `<path class="nl-arc-anim"
                  d="M ${x0 - 22},${baseY} Q ${x0},140 ${x0 + 22},${baseY}"
                  fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round"/>`;
      s += `<text class="nl-svg-text" x="${x0}" y="125" text-anchor="middle"
                  font-size="22" fill="#16a34a">۰</text>`;
    }
  }

  /* ---- نشانگر شروع (۰) ---- */
  s += `<circle cx="${x0}" cy="${y}" r="11" fill="#fbbf24"
              stroke="#d97706" stroke-width="2.5"/>`;

  /* ---- نشانگر مقصد ---- */
  if (revealed) {
    s += `<circle class="nl-marker" cx="${xr}" cy="${y}" r="13" fill="#16a34a"
                stroke="white" stroke-width="3"/>`;
    s += `<text class="nl-svg-text" x="${xr}" y="${y + 6}" text-anchor="middle"
                font-size="15" fill="white">${toFa(result)}</text>`;
  } else {
    s += `<circle class="nl-marker" cx="${xa}" cy="${y}" r="13" fill="#2563eb"
                stroke="white" stroke-width="3"/>`;
    s += `<text class="nl-svg-text" x="${xa}" y="${y + 6}" text-anchor="middle"
                font-size="15" fill="white">${toFa(a)}</text>`;
  }

  return s;
}

/* ==========================================================
   رندر اصلی
   ========================================================== */
function render() {
  const isDots = state.mode.endsWith('dots');
  const isLearn = state.mode.startsWith('learn');

  if (isDots) {
    $('vizDots').style.display = 'flex';
    $('numberLineWrap').hidden = true;
  } else {
    $('vizDots').style.display = 'none';
    $('numberLineWrap').hidden = false;
  }

  if (isLearn) {
    $('learnControls').removeAttribute('hidden');
    $('options').hidden = true;
    $('hintBtn').hidden = true;
  } else {
    $('learnControls').hidden = true;
    $('options').hidden = false;
    $('hintBtn').hidden = (state.mode !== 'practice-dots');
  }

  if (isLearn) renderLearn(isDots);
  else renderPractice(isDots);
}

/* ==========================================================
   آموزش
   ========================================================== */
function renderLearn(isDots) {
  $('prompt').textContent = isDots
    ? 'با دکمه‌ها عددها را تغییر بده و جمع و تفریق را با توپ‌ها ببین!'
    : 'با دکمه‌ها عددها را تغییر بده و ببین روی محور چه اتفاقی می‌افتد!';
  $('prompt').classList.remove('practice');

  if (state.op === '-' && state.b > state.a) state.b = state.a;

  $('valA').textContent = toFa(state.a);
  $('valB').textContent = toFa(state.b);

  const result = state.op === '+' ? state.a + state.b : state.a - state.b;

  $('equation').innerHTML = `
    <div class="num-display">${toFa(state.a)}</div>
    <div class="op-sign">${state.op === '+' ? '+' : '−'}</div>
    <div class="num-display">${toFa(state.b)}</div>
    <div class="equals">=</div>
    <div class="num-display answer">${toFa(result)}</div>
  `;

  if (isDots) {
    $('vizDots').classList.remove('practice-mode');
    renderDots(state.a, state.b, result, state.op, false);
  } else {
    $('numberLineWrap').classList.remove('practice-mode');
    $('numberLine').innerHTML = numberLineSVG(state.a, state.b, result, state.op, true);
  }

  document.querySelectorAll('.op-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.op === state.op);
  });

  document.querySelector('[data-ctrl="a+"]').disabled = state.a >= MAX_NUM;
  document.querySelector('[data-ctrl="a-"]').disabled = state.a <= 0;
  document.querySelector('[data-ctrl="b+"]').disabled =
    state.b >= MAX_NUM ||
    (state.op === '-' && state.b >= state.a) ||
    (state.op === '+' && state.a + state.b >= MAX_NUM);
  document.querySelector('[data-ctrl="b-"]').disabled = state.b <= 0;
}

/* ==========================================================
   تمرین
   ========================================================== */
function renderPractice(isDots) {
  const p = state.practice;
  $('prompt').classList.add('practice');
  $('prompt').textContent = isDots
    ? 'حاصل را پیدا کن و روی جواب درست بزن! (برای راهنما روی دکمه بزن)'
    : 'حاصل را روی محور پیدا کن و روی جواب درست بزن!';

  $('equation').innerHTML = `
    <div class="num-display">${toFa(p.a)}</div>
    <div class="op-sign">${p.op === '+' ? '+' : '−'}</div>
    <div class="num-display">${toFa(p.b)}</div>
    <div class="equals">=</div>
    <div class="num-display hidden-answer" id="answerBox">؟</div>
  `;

  const result = p.op === '+' ? p.a + p.b : p.a - p.b;

  if (isDots) {
    $('vizDots').classList.add('practice-mode');
    if (state.hintShown || p.revealed) {
      renderDots(p.a, p.b, result, p.op, !p.revealed);
    } else {
      renderDotsPlaceholder();
    }
    const hb = $('hintBtn');
    hb.hidden = false;
    if (state.hintShown) {
      hb.classList.add('active');
      hb.textContent = '🙈 پنهان کردن راهنما';
    } else {
      hb.classList.remove('active');
      hb.textContent = '💡 نمایش راهنما';
    }
    hb.disabled = p.revealed;
  } else {
    $('numberLineWrap').classList.add('practice-mode');
    $('numberLine').innerHTML = numberLineSVG(p.a, p.b, result, p.op, p.revealed);
  }

  const opts = $('options');
  opts.innerHTML = '';
  p.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = toFa(opt);
    btn.dataset.value = opt;
    btn.addEventListener('click', () => chooseOption(opt, btn));
    opts.appendChild(btn);
  });
}

/* ==========================================================
   نمایش «؟» به جای توپ‌ها (تمرین)
   ========================================================== */
function renderDotsPlaceholder() {
  const vd = $('vizDots');
  vd.innerHTML = '';
  const ph = document.createElement('div');
  ph.className = 'dots-placeholder';
  ph.innerHTML = '؟ <small>(توپ‌ها پنهان هستند)</small>';
  vd.appendChild(ph);
}

/* ==========================================================
   نمایش توپ‌ها
   ========================================================== */
function renderDots(a, b, result, op, hideResult) {
  const vis = $('vizDots');
  vis.innerHTML = '';

  if (op === '+') {
    const gA = document.createElement('div');
    gA.className = 'dot-group';
    for (let i = 0; i < a; i++) {
      const d = document.createElement('div');
      d.className = 'dot';
      d.style.animationDelay = (i * 0.02) + 's';
      gA.appendChild(d);
    }
    const s1 = document.createElement('span'); s1.className = 'visual-sign'; s1.textContent = '+';
    const gB = document.createElement('div');
    gB.className = 'dot-group';
    for (let i = 0; i < b; i++) {
      const d = document.createElement('div');
      d.className = 'dot yellow';
      d.style.animationDelay = ((a + i) * 0.02) + 's';
      gB.appendChild(d);
    }
    vis.append(gA, s1, gB);
    if (!hideResult) {
      const s2 = document.createElement('span'); s2.className = 'visual-sign'; s2.textContent = '=';
      const gR = document.createElement('div');
      gR.className = 'dot-group';
      for (let i = 0; i < result; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < a ? '' : ' yellow');
        d.style.animationDelay = ((a + b + i) * 0.02) + 's';
        gR.appendChild(d);
      }
      vis.append(s2, gR);
    }
  } else {
    const kept = result;
    const gA = document.createElement('div');
    gA.className = 'dot-group';
    for (let i = 0; i < a; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i >= kept ? ' crossed' : '');
      d.style.animationDelay = (i * 0.02) + 's';
      gA.appendChild(d);
    }
    vis.appendChild(gA);
    if (!hideResult) {
      const s2 = document.createElement('span'); s2.className = 'visual-sign'; s2.textContent = '=';
      const gR = document.createElement('div');
      gR.className = 'dot-group';
      for (let i = 0; i < kept; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        d.style.animationDelay = ((a + i) * 0.02) + 's';
        gR.appendChild(d);
      }
      vis.append(s2, gR);
    }
  }
}

/* ==========================================================
   اکشن‌های آموزش
   ========================================================== */
function changeA(delta) {
  if (state.locked) return;
  const nA = state.a + delta;
  if (nA < 0 || nA > MAX_NUM) return;
  if (state.op === '-' && nA < state.b) return;
  if (state.op === '+' && nA + state.b > MAX_NUM) return;
  state.a = nA;
  SFX[delta > 0 ? 'plus' : 'minus']();
  render();
}
function changeB(delta) {
  if (state.locked) return;
  const nB = state.b + delta;
  if (nB < 0 || nB > MAX_NUM) return;
  if (state.op === '-' && nB > state.a) return;
  if (state.op === '+' && state.a + nB > MAX_NUM) return;
  state.b = nB;
  SFX[delta > 0 ? 'plus' : 'minus']();
  render();
}
function setOp(op) {
  if (state.locked || state.op === op) return;
  state.op = op;
  if (op === '-') {
    if (state.b > state.a) { const t = state.a; state.a = state.b; state.b = t; }
  } else {
    if (state.a + state.b > MAX_NUM) state.b = Math.max(0, MAX_NUM - state.a);
  }
  SFX.swap();
  render();
}

/* ==========================================================
   تمرین — سؤال جدید
   ========================================================== */
function newProblem() {
  const op = Math.random() < 0.5 ? '+' : '-';
  let a, b, answer;

  if (op === '+') {
    a = 2 + Math.floor(Math.random() * 14);
    const maxB = MAX_NUM - a;
    b = 1 + Math.floor(Math.random() * maxB);
    if (b > maxB) b = maxB;
    if (b < 1) b = 1;
    answer = a + b;
  } else {
    a = 8 + Math.floor(Math.random() * 13);
    b = 1 + Math.floor(Math.random() * (a - 1));
    answer = a - b;
  }

  const opts = new Set([answer]);
  let tries = 0;
  while (opts.size < 4 && tries < 80) {
    tries++;
    let delta = Math.floor(Math.random() * 8) - 4;
    if (delta === 0) delta = Math.random() < 0.5 ? 1 : -1;
    let cand = answer + delta;
    if (cand < 0) cand = Math.abs(cand) + 1;
    if (cand > 20) cand = cand - 4;
    if (cand !== answer) opts.add(cand);
  }
  let fill = 0;
  while (opts.size < 4) {
    if (fill !== answer) opts.add(fill);
    fill++;
  }

  const options = Array.from(opts).sort(() => Math.random() - 0.5);
  state.practice = { a, b, op, answer, options, revealed: false };
  state.locked = false;
  state.hintShown = false;
  render();
}

/* ==========================================================
   انتخاب گزینه
   ========================================================== */
function chooseOption(val, btn) {
  if (state.locked) return;
  state.locked = true;
  const p = state.practice;
  const isDots = state.mode.endsWith('dots');

  if (val === p.answer) {
    btn.classList.add('correct');
    SFX.correct();
    state.score++;
    $('score').textContent = 'امتیاز: ' + toFa(state.score);

    const ansBox = $('answerBox');
    ansBox.classList.remove('hidden-answer');
    ansBox.classList.add('answer');
    ansBox.textContent = toFa(p.answer);

    p.revealed = true;
    const result = p.op === '+' ? p.a + p.b : p.a - p.b;

    if (isDots) {
      renderDots(p.a, p.b, result, p.op, false);
      const hb = $('hintBtn');
      hb.disabled = true;
      hb.classList.remove('active');
      hb.textContent = '💡 راهنما';
    } else {
      setTimeout(() => {
        $('numberLine').innerHTML = numberLineSVG(p.a, p.b, result, p.op, true);
        SFX.jump();
      }, 300);
    }

    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    confetti();
    toast('آفرین! درست بود 🎉');

    setTimeout(() => {
      if (state.mode === 'practice-dots' || state.mode === 'practice-line') {
        newProblem();
      }
    }, 2800);
  } else {
    btn.classList.add('wrong');
    SFX.wrong();
    toast('دوباره تلاش کن 💪');
    setTimeout(() => {
      btn.classList.remove('wrong');
      state.locked = false;
    }, 800);
  }
}

/* ==========================================================
   تغییر حالت
   ========================================================== */
function setMode(mode) {
  if (state.mode === mode) return;
  state.mode = mode;
  state.locked = false;
  state.hintShown = false;

  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode);
  });

  if (mode === 'practice-dots' || mode === 'practice-line') {
    SFX.start();
    newProblem();
  } else {
    render();
  }
}

/* ==========================================================
   پیام و جشن
   ========================================================== */
let toastTimer = null;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
function confetti() {
  const emojis = ['🎉', '⭐', '✨', '🎈', '🏆', '💎'];
  for (let i = 0; i < 20; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = (Math.random() * 96) + 'vw';
    el.style.fontSize = (16 + Math.random() * 22) + 'px';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2900);
  }
}

/* ==========================================================
   رویدادها
   ========================================================== */
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    ac(); SFX.tap(); setMode(tab.dataset.mode);
  });
});
document.querySelectorAll('.op-btn').forEach(b => {
  b.addEventListener('click', () => { ac(); setOp(b.dataset.op); });
});
document.querySelectorAll('.num-ctrl').forEach(b => {
  b.addEventListener('click', () => {
    ac();
    const act = b.dataset.ctrl;
    if (act === 'a+') changeA(1);
    else if (act === 'a-') changeA(-1);
    else if (act === 'b+') changeB(1);
    else if (act === 'b-') changeB(-1);
  });
});
$('hintBtn').addEventListener('click', () => {
  ac(); SFX.tap();
  state.hintShown = !state.hintShown;
  render();
});
document.addEventListener('pointerdown', () => ac(), { once: true });

/* شروع */
render();
</script>
</body>
