<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ریاضی دوم ابتدایی - فصل اول</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #e0f7fa 0%, #fce4ec 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #00796b;
    font-size: 2rem;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }
  .menu {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .menu button {
    font-family: inherit;
    font-size: 1.2rem;
    font-weight: 700;
    padding: 15px 25px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    min-width: 120px;
    color: #fff;
  }
  .menu button:nth-child(1) { background: #4caf50; }
  .menu button:nth-child(2) { background: #2196f3; }
  .menu button:nth-child(3) { background: #ff9800; }
  .menu button:nth-child(4) { background: #e91e63; }
  .menu button:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
  .menu button.active {
    outline: 4px solid #fff;
    box-shadow: 0 0 0 4px #333, 0 6px 12px rgba(0,0,0,0.2);
    transform: scale(1.05);
  }
  .frame-wrapper {
    background: #fff;
    border-radius: 24px;
    padding: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 70vh;
    min-height: 400px;
    border: none;
    border-radius: 16px;
    display: block;
    background: #f9f9f9;
  }
  .footer {
    text-align: center;
    margin-top: 15px;
    color: #666;
    font-size: 0.9rem;
  }
  @media (max-width: 600px) {
    h1 { font-size: 1.4rem; }
    .menu button { font-size: 1rem; padding: 12px 18px; min-width: 90px; }
    iframe { height: 60vh; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🧮 ریاضی دوم ابتدایی - فصل اول</h1>
  <div class="menu">
    <button data-src="1.html" class="active">انیمیشن ۱</button>
    <button data-src="2.html">انیمیشن ۲</button>
    <button data-src="3.html">انیمیشن ۳</button>
    <button data-src="4.html">انیمیشن ۴</button>
  </div>
  <div class="frame-wrapper">
    <iframe id="animationFrame" src="1.html" title="انیمیشن آموزشی"></iframe>
  </div>
  <div class="footer">برای تغییر انیمیشن، روی دکمه‌های بالا بزنید ✨</div>
</div>
<script>
  const buttons = document.querySelectorAll('.menu button');
  const frame = document.getElementById('animationFrame');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frame.src = btn.dataset.src;
    });
  });
</script>
</body>
</html>
